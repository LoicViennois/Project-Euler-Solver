<div class="row mx-0">
  @if (problems().length > 0) {
    @for (pbs of problems(); track pbs) {
      <div class="col-sm p-1">
        <div class="d-flex justify-content-center">
          <button (click)="solve(pbs)" class="btn btn-secondary btn-solve mb-1 mt-2">
            Solve problems
            {{ pbs | firstId }}
            to
            {{ pbs | lastId }}
          </button>
        </div>
        @for (p of pbs; track p.id) {
          <euler-problem-card [problem]="p"></euler-problem-card>
        }
      </div>
    }
  } @else {
    <div class="text-center text-white">
      <p class="pt-5">
        <i class="fas fa-4x fa-sync-alt fa-spin"></i>
      </p>
    </div>
  }
</div>
